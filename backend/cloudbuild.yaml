steps:
  # Build the container image with caching
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - --destination=gcr.io/$PROJECT_ID/docu-mate-backend:latest
      - --destination=gcr.io/$PROJECT_ID/docu-mate-backend:$BUILD_ID
      - --cache=true
      - --cache-ttl=168h
      - --compressed-caching=false

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'docu-mate-backend'
      - '--image=gcr.io/$PROJECT_ID/docu-mate-backend:latest'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=JWT_SECRET_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest'

images:
  - 'gcr.io/$PROJECT_ID/docu-mate-backend:latest'
  - 'gcr.io/$PROJECT_ID/docu-mate-backend:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
