# Cloud Build configuration for deploying to Cloud Run
steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/docu-mate-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/docu-mate-backend:latest'
      - './backend'
    id: 'build-backend'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/docu-mate-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/docu-mate-frontend:latest'
      - './frontend'
    id: 'build-frontend'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/docu-mate-backend:$COMMIT_SHA'
    id: 'push-backend'
    waitFor: ['build-backend']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/docu-mate-frontend:$COMMIT_SHA'
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'docu-mate-backend'
      - '--image=gcr.io/$PROJECT_ID/docu-mate-backend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=DATABASE_URL=$$DATABASE_URL,JWT_SECRET_KEY=$$JWT_SECRET_KEY,PINECONE_API_KEY=$$PINECONE_API_KEY,GEMINI_API_KEY=$$GEMINI_API_KEY'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'docu-mate-frontend'
      - '--image=gcr.io/$PROJECT_ID/docu-mate-frontend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NEXT_PUBLIC_API_BASE=https://docu-mate-backend-XXXXX-uc.a.run.app,NEXTAUTH_URL=https://docu-mate-frontend-XXXXX-uc.a.run.app'
      - '--set-secrets=NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest'
    id: 'deploy-frontend'
    waitFor: ['push-frontend', 'deploy-backend']

images:
  - 'gcr.io/$PROJECT_ID/docu-mate-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/docu-mate-backend:latest'
  - 'gcr.io/$PROJECT_ID/docu-mate-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/docu-mate-frontend:latest'

timeout: '1200s'
