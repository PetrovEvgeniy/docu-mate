name: Deploy to Google Cloud Run

# SETUP REQUIRED:
# This workflow requires Workload Identity Federation to be configured.
# Add these secrets to your GitHub repository:
#   - GCP_WORKLOAD_IDENTITY_PROVIDER: Full resource name of workload identity provider
#   - GCP_SERVICE_ACCOUNT: Service account email with Cloud Run/Build permissions
#
# Setup guide: https://cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
#
# Manual deployment alternative:
#   cd backend && gcloud builds submit --config cloudbuild.yaml .
#   cd frontend && gcloud builds submit --config cloudbuild.yaml .

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0618163758
  REGION: us-central1

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend
        run: |
          cd backend
          gcloud builds submit --config cloudbuild.yaml .

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Frontend
        run: |
          cd frontend
          gcloud builds submit --config cloudbuild.yaml .
